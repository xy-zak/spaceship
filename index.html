<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Spaceship</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>" />
    <link rel="stylesheet" href="/src/theme.css" />
    <style>
      @property --fill {
        syntax: "<number>";
        inherits: false;
        initial-value: 0;
      }
      /* How full the main knob's buffer is, from 0 to 1. */
      @property --buffer {
        syntax: "<number>";
        inherits: false;
        initial-value: 0;
      }
      :root {
        /* Each box covering a word adds one layer, so overlaps read darker. */
        --attention: color-mix(in srgb, var(--ink) 12%, transparent);
        --hair: 1px;
        --stroke: 1.5px;
        --selected-stroke: 3px;
        --dash: 3 3;
        /* Read by the HUD to measure its labels. */
        --hud-size: 12px;
        --hud-line: 16px;
        --numeral-size: 11px;
        --tray-height: 24px;
        /* Room each side of the column for pinned future knobs and their labels. */
        --margin: 24ch;
        --knob: 16px;
        --knob-future: 14px;
        --fast: 120ms;
        --settle: 300ms;
        /* How long an orange trace takes to fade. */
        --fade: 450ms;
        --pin: 600ms cubic-bezier(0.2, 0.8, 0.2, 1);
        --dimmed: 0.3;
        scrollbar-gutter: stable;
      }
      [data-dimmed] {
        opacity: var(--dimmed);
      }
      body {
        margin: 0;
        padding-bottom: var(--tray-height);
      }
      #text {
        width: clamp(30ch, 100% - 2 * var(--margin), 90ch);
        margin-inline: auto;
        padding-block: var(--padding);
        white-space: pre;
        line-height: var(--line);
        touch-action: none;
        text-underline-position: under;

        &::selection,
        *::selection {
          background: var(--hot-wash);
          color: inherit;
        }
      }
      ::highlight(attention-word) {
        text-decoration: underline var(--stroke) var(--ink);
      }
      ::highlight(attention-word-active) {
        text-decoration: underline var(--stroke) var(--hot);
      }
      ::highlight(pinned-sentence) {
        text-decoration: underline dashed var(--hair) var(--ink-2);
      }
      ::highlight(attention-shade-1),
      ::highlight(attention-shade-2),
      ::highlight(attention-shade-3),
      ::highlight(attention-shade-4),
      ::highlight(attention-shade-5) {
        background: var(--attention);
      }
      #links {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;

        > path {
          fill: none;
          stroke: var(--ink-2);
          stroke-width: var(--hair);
          transition: opacity var(--fast);
        }

        #attention-active-link {
          stroke: var(--hot);
          stroke-width: var(--stroke);
        }

        #future-links,
        #future-tuned-link[data-choosing] {
          stroke-dasharray: var(--dash);
        }

        #future-tuned-link {
          stroke: var(--ink);
        }
      }
      #future-hud {
        pointer-events: none;

        path {
          fill: none;
          stroke: var(--ink);
          stroke-width: var(--hair);
        }
        [data-role="backdrop"] {
          fill: var(--bg);
          stroke: none;
          opacity: 0.92;
        }
        [data-role="rim"][data-dashed] {
          stroke-dasharray: var(--dash);
        }
        [data-role="ring"] {
          stroke: var(--ink-5);
        }
        [data-role="minor"] {
          stroke: var(--ink-3);
        }
        [data-role="ruler"] {
          stroke: var(--ink-2);
        }
        [data-role="selected"] {
          stroke: var(--hot);
          stroke-width: var(--selected-stroke);
        }
        circle {
          fill: var(--hot);
          stroke: none;
        }
        rect[data-plate] {
          fill: var(--hot);
        }
        text {
          fill: var(--ink-2);
          stroke: var(--bg);
          stroke-width: 4px;
          paint-order: stroke;
          font-size: var(--hud-size);
          line-height: var(--hud-line);

          &[data-numeral] {
            fill: var(--ink-3);
            font-size: var(--numeral-size);
          }
          &[data-selected] {
            fill: var(--bg);
            stroke: none;
          }
          &[data-readout] {
            fill: var(--ink);
          }
        }
        [data-tone="dim"] {
          fill: var(--ink-3);
        }
        [data-tone="live"] {
          fill: var(--hot);
        }
      }
      .knob {
        --size: var(--knob);
        position: absolute;
        top: 0;
        left: 0;
        width: var(--size);
        height: var(--size);
        padding: 0;
        border: var(--hair) solid var(--ink);
        border-radius: 50%;
        background: conic-gradient(var(--hot) calc(var(--fill, 0) * 1turn), transparent 0);
        color: inherit;
        font: inherit;
        cursor: grab;
        user-select: none;
        touch-action: none;
        transition:
          opacity var(--fast),
          border-color var(--settle);
      }
      #pointer {
        --arc: var(--ink);
        /*
         * Six segments on a ring between the pip and the rim, lit clockwise from twelve, one whole segment at a time, as the buffer past the knob fills;
         * unlit ones stay faint. Three bars through the middle cut gaps of even width between them.
         */
        --gap-bar: transparent calc(50% - 0.75px), var(--bg) 0 calc(50% + 0.75px), transparent 0;
        background:
          radial-gradient(circle closest-side, var(--bg) 2.5px, transparent 3px 4.5px, var(--bg) 5px), linear-gradient(90deg, var(--gap-bar)),
          linear-gradient(30deg, var(--gap-bar)), linear-gradient(150deg, var(--gap-bar)),
          conic-gradient(var(--arc) calc(round(up, var(--buffer), 1 / 6) * 1turn), var(--ink-5) 0);
        transition:
          opacity var(--fast),
          border-color var(--settle),
          --buffer var(--settle);

        /* A pip marks the exact caret. */
        &::before {
          content: "";
          position: absolute;
          inset: calc(50% - 1px);
          border-radius: 50%;
          background: var(--ink);
        }
        &::after {
          content: "";
          position: absolute;
          inset: -5px;
          border: var(--hair) solid var(--ink-3);
          border-radius: 50%;
          /* fades in as the hand nears the knob (set by the pointer), full on hover */
          opacity: var(--near, 0);
          scale: calc(0.7 + 0.3 * var(--near, 0));
          transition:
            opacity var(--fast),
            scale var(--fast);
        }
        &:hover::after {
          opacity: 1;
          scale: 1;
        }
        &[data-generating] {
          --arc: var(--hot);
        }
        &[data-generating]::after {
          opacity: 1;
          scale: 1;
          border-color: transparent;
          border-top-color: var(--hot);
          animation: spin 0.9s linear infinite;
        }
        &[data-dragging] {
          border-color: var(--hot);
          cursor: grabbing;
          transition: none;

          &::before {
            background: var(--hot);
          }
          /* Reticle ticks beyond the ring. */
          &::after {
            inset: -9px;
            border: none;
            opacity: 1;
            scale: 1;
            animation: none;
            background:
              linear-gradient(var(--hot), var(--hot)) 50% 0 / 1px 5px no-repeat,
              linear-gradient(var(--hot), var(--hot)) 50% 100% / 1px 5px no-repeat,
              linear-gradient(var(--hot), var(--hot)) 0 50% / 5px 1px no-repeat,
              linear-gradient(var(--hot), var(--hot)) 100% 50% / 5px 1px no-repeat;
          }
        }
      }
      @keyframes spin {
        to {
          rotate: 1turn;
        }
      }
      .future {
        --size: var(--knob-future);
        --fill-color: var(--ink);
        border-style: dashed;
        background: conic-gradient(var(--fill-color) calc(var(--fill, 0) * 1turn), var(--bg) 0);

        > span {
          position: absolute;
          top: 50%;
          left: calc(100% + var(--gap));
          translate: 0 -50%;
          white-space: nowrap;
          pointer-events: none;
          background: var(--bg);
          font-size: var(--hud-size);
          line-height: var(--hud-line);

          &[hidden] {
            display: none;
          }

          b {
            font-weight: inherit;
            color: var(--ink-3);
          }
        }

        &[data-tuned] {
          border-style: solid;
        }

        /* The menu is on its way. */
        &[data-loading] {
          border-color: var(--hot);
        }

        &[data-dragging] {
          --fill-color: var(--hot);
          border-color: var(--hot);
          cursor: grabbing;
          transition: none;
        }

        &[data-tracking],
        &[data-pinned] {
          --fill-color: var(--hot);
          border-color: var(--hot);

          > span b {
            color: var(--hot);
          }
        }

        &[data-dimmed] > span {
          background: transparent;
        }

        &[data-tracking] {
          transition:
            --fill var(--settle),
            opacity var(--fast);
        }

        /* Moved into the right gutter once the text grew over it: it travels like a pin, still linked by its dashed line, until it pins. */
        &[data-parked] {
          transition:
            translate var(--pin),
            --fill var(--settle),
            opacity var(--fast);

          > span {
            width: max-content;
            white-space: normal;
            text-align: start;
          }
        }

        &[data-pinned] {
          cursor: default;
          transition:
            translate var(--pin),
            --fill var(--settle),
            opacity var(--fast);

          > span {
            width: max-content;
            white-space: normal;
            text-align: start;
            background: transparent;
            pointer-events: auto;
          }

          &[data-side="left"] > span {
            text-align: end;
          }
        }

        &[data-side="left"] > span {
          left: auto;
          right: calc(100% + var(--gap));
        }
      }
      /* Polybar-style modules in one centered row: model, text, steering, sound; a hairline between every field. */
      #tray {
        position: fixed;
        inset: auto 0 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: var(--tray-height);
        padding-inline: calc(1.5 * var(--gap));
        border-top: var(--hair) solid var(--ink-5);
        background: var(--bg);
        color: var(--ink-3);
        font-size: var(--numeral-size);
        line-height: var(--tray-height);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;

        .zone {
          display: flex;

          & + .zone {
            border-left: var(--hair) solid var(--ink-5);
          }
        }
        [data-field] {
          padding-inline: var(--gap);

          & + [data-field] {
            border-left: var(--hair) solid var(--ink-5);
          }
        }
        abbr {
          margin-right: 0.5ch;
          text-decoration: none;
          cursor: help;
        }
        b {
          display: inline-block;
          margin-left: 0.5ch;
          font-weight: inherit;
          color: var(--ink);
        }
        abbr + b {
          margin-left: 0;
        }
        small {
          font-size: inherit;
          color: var(--ink-3);
        }

        /* Every reading has a fixed width that fits its widest value, so the centered tray never shifts as digits come and go. */
        [data-field="rate"] b,
        [data-field="latency"] b {
          width: 7ch;
        }
        [data-field="words"] b {
          width: 9ch;
        }
        [data-field="turn"] b {
          width: 7ch;
        }
        [data-field="boxes"] b,
        [data-field="steering"] b,
        [data-field="pinned"] b {
          width: 2ch;
        }

        /* Streaming shows as the live rate and the growing buffer turning orange. */
        #status[data-streaming] :is([data-field="rate"] b, [data-field="words"] small) {
          color: var(--hot);
        }
      }
      @keyframes pulse {
        to {
          opacity: 0.3;
        }
      }
      #status {
        display: contents;
      }
      #turn {
        padding-inline: var(--gap);
        border-right: var(--hair) solid var(--ink-5);
        border-left: 3px solid var(--station, transparent);
        color: var(--ink);
      }
      #sound-toggle,
      #extra-link {
        padding: 0 var(--gap);
        border: none;
        border-left: var(--hair) solid var(--ink-5);
        background: none;
        /* brightens as the hand nears it */
        color: color-mix(in srgb, var(--ink) calc(var(--near, 0) * 100%), var(--ink-2));
        font: inherit;
        text-align: start;
        cursor: pointer;

        b {
          width: 3ch;
          margin-left: 0.5ch;
          font-weight: inherit;
          text-align: start;
        }
        &:hover {
          color: var(--ink);
        }
      }
      #extra-link {
        text-decoration: none;
      }
      #sound-toggle[aria-pressed="false"] {
        color: var(--ink-4);
      }
      /*
       * The page's pointer, for mice and pens (see src/text/pointer.ts): a crosshair at the hand, brackets on what it is near,
       * and a steering vector while a press pulls the main knob. The OS pointer is hidden once it takes over.
       */
      /* A modal dialog sits above the page's pointer, so the system one returns while it is open. */
      html[data-cursor="custom"]:not(:has(dialog:modal)),
      html[data-cursor="custom"]:not(:has(dialog:modal)) * {
        cursor: none !important;
      }
      #cursor {
        --x: -1000px;
        --y: -1000px;
        --line: var(--ink-5);
        position: fixed;
        inset: 0;
        z-index: 1000;
        overflow: hidden;
        pointer-events: none;

        html:is(:not([data-cursor="custom"]), :has(dialog:modal)) & {
          display: none;
        }
        /* orange while the hand changes something: dragging, or pulling the knob */
        &[data-live] {
          --line: color-mix(in srgb, var(--hot) 30%, transparent);
        }
        /* hairlines edge to edge, each leaving a 12px gap around the point */
        .hairline {
          position: absolute;
          top: 0;
          left: 0;
        }
        .vertical {
          bottom: 0;
          width: 1px;
          translate: var(--x) 0;
          background: linear-gradient(to bottom, var(--line) calc(var(--y) - 6px), transparent 0 calc(var(--y) + 6px), var(--line) 0);
        }
        .horizontal {
          right: 0;
          height: 1px;
          translate: 0 var(--y);
          background: linear-gradient(to right, var(--line) calc(var(--x) - 6px), transparent 0 calc(var(--x) + 6px), var(--line) 0);
        }
        .marks {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: visible;

          path,
          line {
            fill: none;
            stroke-width: var(--hair);
          }
          /* brackets at a block's defining corners, and a fainter contour around a block of several lines */
          .corners {
            stroke: var(--ink-2);
          }
          .contour {
            stroke: var(--ink-2);
            stroke-opacity: 0.35;
          }
          /* over text: where a selection would start */
          .ibeam {
            stroke: var(--ink-2);
          }
          /* past the knob: the way to the nearest target */
          .tether {
            stroke: var(--ink-3);
            stroke-dasharray: var(--dash);
          }
          /* the attention box under the hand: orange, as a press there grabs it */
          .grabbable :is(.corners, .contour) {
            stroke: var(--hot);
          }
          /* what the hand is changing: a selection's ends and the words it will become, the word a pull has reached */
          .live-marks :is(.corners, .contour, .ends) {
            stroke: var(--hot);
          }
          :is(.vector, .vector-ticks) {
            display: none;
          }
        }
        &[data-steer="pulling"] .vector {
          display: inline;
          stroke: color-mix(in srgb, var(--hot) 70%, transparent);
        }
        &[data-steer="pulling"] .vector-ticks {
          display: inline;
          stroke: var(--hot);
        }
        &[data-steer="behind"] .vector {
          display: inline;
          stroke: var(--ink-4);
          stroke-dasharray: var(--dash);
        }
        /* past the knob, where a press steers, a high-contrast dot marks the exact point: ink, ringed in the page color so it reads over anything */
        .dot {
          position: absolute;
          top: 0;
          left: 0;
          display: none;
          width: 5px;
          height: 5px;
          margin: -2.5px 0 0 -2.5px;
          border-radius: 50%;
          background: var(--ink);
          box-shadow: 0 0 0 1.5px var(--bg);
          translate: var(--x) var(--y);
        }
        /* the same dot over an attention box: it marks what a press would drag */
        &:is([data-zone="ahead"], [data-zone="box"]) .dot {
          display: block;
        }
        &:is([data-zone="ahead"], [data-zone="box"])[data-live] .dot {
          background: var(--hot);
        }
        .readout {
          position: absolute;
          top: 0;
          left: 0;
          padding: 0 3px;
          background: var(--bg);
          white-space: nowrap;
          font-size: var(--numeral-size);
          line-height: 12px;
          color: var(--ink-3);

          b {
            font-weight: inherit;
            color: var(--ink);
          }
          &:empty {
            display: none;
          }
        }
        &[data-steer="pulling"] .vector-label b {
          color: var(--hot);
        }
      }
    </style>
  </head>
  <body>
    <div id="text"></div>
    <svg id="links" aria-hidden="true">
      <g id="author-brackets"></g>
      <path id="attention-links" />
      <path id="attention-active-link" />
      <g id="future-hud"></g>
      <path id="future-links" />
      <path id="future-tuned-link" />
    </svg>
    <button
      id="pointer"
      class="knob"
      type="button"
      aria-label="drag to scrub the text forward or back, double click to expand attention highlights or remove everything attached, shift and drag to open the fan menu"
    ></button>
    <div id="bookmarks" aria-hidden="true"></div>
    <template id="future-knob">
      <button class="knob future" type="button" aria-label="future knob, …, double click to delete"><span>…</span></button>
    </template>
    <div id="cursor" aria-hidden="true"></div>
    <footer id="tray">
      <output id="turn" aria-live="polite" hidden>connecting…</output>
      <output id="status" aria-live="off"></output>
      <button id="sound-toggle" type="button" aria-pressed="true" aria-label="sound">♪<b>on</b></button>
      <a id="extra-link" href="extra/style-1.html">extra</a>
    </footer>
    <script type="module" src="/src/text/main.ts"></script>
  </body>
</html>
