<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Spaceship · view</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>" />
    <link rel="stylesheet" href="/src/theme.css" />
    <style>
      body {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100vh;
        margin: 0;
      }
      header,
      footer {
        position: sticky;
        padding: var(--gap) var(--padding);
        background: var(--bg);
        color: var(--ink-3);
      }
      header {
        top: 0;
        z-index: 1;
      }
      footer {
        bottom: 0;
      }
      /* The manifesto, and the argument beside it, which stays in view as the manifesto scrolls. */
      #page {
        display: grid;
        grid-template-columns: minmax(0, 90ch) minmax(0, 36ch);
        justify-content: center;
        gap: calc(3 * var(--gap));
        padding-inline: var(--padding);
      }
      #argument {
        position: sticky;
        top: 0;
        margin: 0;
        padding-block: var(--padding);
        color: var(--ink-2);
      }
      @media (width < 140ch) {
        #page {
          grid-template-columns: minmax(0, 1fr);
        }
        #argument {
          position: static;
        }
      }
      main {
        padding-block: var(--padding);
        line-height: var(--line);
        /* A turn's text breaks into paragraphs at its blank lines. */
        white-space: pre-line;
      }
      /* Each station's words are bracketed, tagged and highlighted on hover (in the theme); peach is the active station's live text. */
      [data-station="opening"] {
        color: var(--ink-2);
        font-style: italic;
      }
      [data-live] {
        color: var(--hot);
      }
      #banner[data-station] {
        padding-left: var(--gap);
        border-left: 3px solid var(--station);
        color: var(--ink);
      }
      #authors {
        position: absolute;
        top: 0;
        left: 0;
        overflow: visible;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <svg id="authors" width="1" height="1" aria-hidden="true"><g id="author-brackets"></g></svg>
    <div id="bookmarks" aria-hidden="true"></div>
    <header><output id="banner">connecting…</output></header>
    <div id="page">
      <main id="manifesto"></main>
      <aside><ol id="argument" aria-label="the argument" hidden></ol></aside>
    </div>
    <footer><output id="steering"></output></footer>
    <script type="module" src="/src/view/main.ts"></script>
  </body>
</html>
